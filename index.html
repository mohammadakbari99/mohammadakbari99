<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سلطان حکم — نسخه مدرن آنلاین</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07110d;color:#f7f1df;font-family:Tahoma,Arial,sans-serif}
button,input{font:inherit}.screen{display:none;min-height:100vh}.screen.active{display:block}
.home{display:grid;place-items:center;padding:30px;background:radial-gradient(circle at 50% 0,#173c2c,#07110d 55%)}
.logo{text-align:center}.logo h1{font-size:clamp(34px,7vw,64px);margin:0 0 8px;letter-spacing:-2px}.logo p{color:#b8c5bc}
.panel{width:min(760px,94vw);background:#0d1d16;border:1px solid #294537;border-radius:24px;padding:25px;box-shadow:0 20px 70px #0008}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.btn{border:1px solid #3a5b49;background:#152a20;color:#fff;padding:15px 16px;border-radius:15px;cursor:pointer;font-weight:700;transition:.18s}.btn:hover{transform:translateY(-2px);background:#1b3829}.primary{background:#b8954b;border-color:#d2b66f;color:#15120b}.danger{background:#431f21;border-color:#703238}.input{width:100%;padding:14px;border-radius:13px;border:1px solid #355345;background:#08130f;color:#fff;outline:none}.input:focus{border-color:#c6a35a}.field{margin:10px 0}.label{display:block;color:#b9c7bd;font-size:13px;margin-bottom:6px}
.lobby{padding:25px;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#173b2c,#07110d 65%)}.lobbyBox{width:min(900px,96vw)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.code{font:900 34px/1 monospace;letter-spacing:8px;background:#07110d;border:1px solid #876d36;border-radius:16px;padding:18px;text-align:center;color:#e4c878}.roomHead{display:grid;grid-template-columns:1fr 220px;gap:18px}.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.seat{min-height:95px;border:1px solid #294537;background:#09150f;border-radius:16px;padding:14px}.seat strong{display:block;margin-top:8px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555}.online{background:#62c98a}
.game{min-height:100vh;background:radial-gradient(circle at 50% 45%,#176340,#07311f 42%,#041b12 75%);padding-bottom:180px}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#06150fdd;backdrop-filter:blur(12px);border-bottom:1px solid #2b5542}.top .title{font-weight:900}.top .stats{font-size:13px;color:#c7d2ca}.table{position:relative;width:min(900px,96vw);height:min(680px,72vh);min-height:510px;margin:25px auto;border:10px solid #4b3820;border-radius:44px;background:radial-gradient(ellipse,#198052,#0b5738 62%,#063520);box-shadow:inset 0 0 80px #001b10aa,0 30px 80px #0008}.seatLabel{position:absolute;padding:8px 11px;background:#06140fcc;border:1px solid #315744;border-radius:12px;font-size:12px}.north{top:12px;left:50%;transform:translateX(-50%)}.south{bottom:105px;left:50%;transform:translateX(-50%)}.west{left:10px;top:50%;transform:translateY(-50%)}.east{right:10px;top:50%;transform:translateY(-50%)}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;height:240px}.played{position:absolute;width:74px;height:106px;transition:.35s;filter:drop-shadow(0 8px 9px #0008)}.played.s{left:50%;bottom:0;transform:translateX(-50%) rotate(1deg)}.played.n{left:50%;top:0;transform:translateX(-50%) rotate(-1deg)}.played.w{left:0;top:50%;transform:translateY(-50%) rotate(-7deg)}.played.e{right:0;top:50%;transform:translateY(-50%) rotate(7deg)}
.hand{position:fixed;z-index:15;bottom:0;left:0;right:0;height:185px;background:linear-gradient(#07150fee,#06110df9);border-top:1px solid #294b3b;padding-top:10px;overflow:visible}.fan{position:relative;width:min(850px,100vw);height:170px;margin:auto}.handCard{position:absolute;bottom:4px;left:50%;width:65px;height:94px;cursor:pointer;transform-origin:50% 100%;transition:transform .16s,filter .16s;filter:drop-shadow(0 7px 6px #0007)}.handCard:hover{z-index:30;filter:drop-shadow(0 12px 12px #0009)}.handCard.sel{z-index:40!important}.handCard.sel .playing{transform:translateY(-28px) scale(1.04)!important}
.card{position:relative;width:100%;height:100%;border-radius:8px;background:linear-gradient(135deg,#fffdf6,#eee8d8);border:1px solid #bcb29c;color:#171717;overflow:hidden;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px #d3c8b0}.card:after{content:"";position:absolute;inset:5px;border:1px solid #c9bda5;border-radius:5px;pointer-events:none}.red{color:#a71924}.corner{position:absolute;z-index:2;top:6px;left:7px;font:bold 15px Georgia,serif;line-height:13px;text-align:center}.corner span{font-size:12px}.corner.br{top:auto;left:auto;right:7px;bottom:6px;transform:rotate(180deg)}.pip{position:absolute;font:20px Georgia,serif;z-index:1;transform:translate(-50%,-50%)}.court{position:absolute;inset:20px 10px 12px;border:1px solid #b9aa8c;border-radius:5px;background:linear-gradient(135deg,#f3e5bf,#fffdf5 45%,#e8d3ad);overflow:hidden}.court .frame{position:absolute;inset:5px;border:2px solid currentColor;border-radius:4px;opacity:.5}.court .head{position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);width:25px;height:25px;border:2px solid currentColor;border-radius:50%;background:#f4c9a7}.court .body{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);width:48px;height:54px;border:2px solid currentColor;border-radius:50% 50% 8px 8px;background:linear-gradient(90deg,currentColor 0 25%,#eee 25% 75%,currentColor 75%)}.court .crown{position:absolute;left:50%;top:9%;transform:translateX(-50%);font:bold 13px Georgia}.court .sword{position:absolute;left:50%;top:39%;height:50px;border-left:3px solid currentColor;transform:rotate(25deg)}.court .sword:after{content:"";position:absolute;top:1px;left:-7px;width:12px;height:4px;background:currentColor}.court .orn{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font:bold 16px Georgia}.aceMark{position:absolute;inset:24px;display:grid;place-items:center;font:55px Georgia,serif}
.toast{position:fixed;z-index:100;left:50%;bottom:205px;transform:translateX(-50%);background:#0a1711ee;border:1px solid #446653;border-radius:12px;padding:10px 16px;display:none}.toast.show{display:block}
@media(max-width:650px){.roomHead{grid-template-columns:1fr}.seats{grid-template-columns:repeat(2,1fr)}.table{height:56vh;min-height:420px}.center{width:245px;height:200px}.played{width:60px;height:86px}.hand{height:155px}.fan{height:145px}.handCard{width:48px;height:70px}.corner{font-size:12px}.pip{font-size:16px}.aceMark{font-size:40px}.court .body{width:38px;height:44px}.court .head{width:20px;height:20px}.toast{bottom:170px}}
</style>
</head>
<body>
<section id="home" class="screen active home">
  <div class="panel">
    <div class="logo"><h1>♠ سلطان حکم</h1><p>میز مدرن، کارت‌های کلاسیک، بازی آنلاین ۴ نفره</p></div>
    <div class="grid" style="margin-top:25px">
      <button class="btn primary" onclick="startLocal(4)">۴ نفره با هوش مصنوعی</button>
      <button class="btn" onclick="startLocal(2)">۲ نفره</button>
      <button class="btn" onclick="openLobby()">لابی آنلاین ۴ نفره</button>
      <button class="btn" onclick="invite()">معرفی به دوستان</button>
    </div>
  </div>
</section>

<section id="lobby" class="screen lobby">
 <div class="lobbyBox panel">
  <div class="row" style="justify-content:space-between"><h2 style="margin:0">لابی آنلاین</h2><button class="btn" onclick="show('home')">منو</button></div>
  <div id="lobbyStart">
   <div class="grid" style="margin-top:18px">
    <div>
      <h3>ایجاد اتاق</h3>
      <div class="field"><label class="label">نام شما</label><input id="hostName" class="input" placeholder="مثلاً محمد"></div>
      <div class="field"><label class="label">نام اتاق</label><input id="roomName" class="input" placeholder="مثلاً اتاق محمد"></div>
      <button class="btn primary" onclick="createRoom()">ایجاد اتاق ۴ نفره</button>
    </div>
    <div>
      <h3>پیوستن با کد ۶ رقمی</h3>
      <div class="field"><label class="label">نام شما</label><input id="guestName" class="input" placeholder="نام شما"></div>
      <div class="field"><label class="label">کد اتاق</label><input id="roomCode" class="input" inputmode="numeric" maxlength="6" placeholder="۱۲۳۴۵۶"></div>
      <button class="btn" onclick="joinRoom()">ورود مستقیم به اتاق</button>
    </div>
   </div>
  </div>
  <div id="roomView" style="display:none">
    <div class="roomHead">
      <div><h3 id="roomTitle"></h3><p style="color:#aebbb2">کد را برای دوستانت بفرست؛ با وارد کردن همین کد مستقیماً وارد اتاق می‌شوند.</p></div>
      <div><div class="label">کد اتاق</div><div id="roomCodeView" class="code"></div><button class="btn" style="width:100%;margin-top:8px" onclick="copyRoomCode()">کپی کد</button></div>
    </div>
    <div id="seats" class="seats"></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn" onclick="shareRoom()">دعوت دوستان</button>
      <button id="startOnline" class="btn primary" onclick="startOnlineGame()">شروع بازی</button>
    </div>
  </div>
 </div>
</section>

<section id="game" class="screen game">
 <div class="top">
   <button class="btn" onclick="backToMenu()">منو 🏠</button>
   <div class="title">سلطان حکم</div>
   <div class="stats" id="scoreText">۰ - ۰</div>
 </div>
 <div class="table">
   <div id="label0" class="seatLabel north">بازیکن</div><div id="label1" class="seatLabel east">بازیکن</div>
   <div id="label2" class="seatLabel south">شما</div><div id="label3" class="seatLabel west">بازیکن</div>
   <div class="center" id="trick"></div>
 </div>
 <div id="toast" class="toast"></div>
 <div class="hand"><div id="fan" class="fan"></div></div>
</section>

<script>
const suits=['s','h','d','c'], sy={s:'♠',h:'♥',d:'♦',c:'♣'}, red=new Set(['h','d']);
let mode='local', players=4, me=2, deck=[], hands=[[],[],[],[]], turn=2, trick=[], selected=null, hokm='s', scores=[0,0], ws=null, roomCode='', roomHost=false, roomPlayers=[];

function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function invite(){const t='سلطان حکم — بیا آنلاین ۴ نفره بازی کنیم!'; if(navigator.share) navigator.share({title:'سلطان حکم',text:t}).catch(()=>{}); else navigator.clipboard?.writeText(t).then(()=>toast('متن دعوت کپی شد'))}
function backToMenu(){if(mode==='online'&&ws){ws.close();ws=null}show('home')}
function makeDeck(){let a=[];for(const s of suits)for(let r=2;r<=14;r++)a.push({s,r,id:s+r});return a.sort(()=>Math.random()-.5)}
function nameRank(r){return r===14?'A':r===13?'K':r===12?'Q':r===11?'J':r}
const pipPos={2:[[50,25],[50,75]],3:[[50,22],[50,50],[50,78]],4:[[28,25],[72,25],[28,75],[72,75]],5:[[28,25],[72,25],[50,50],[28,75],[72,75]],6:[[28,22],[72,22],[28,50],[72,50],[28,78],[72,78]],7:[[28,22],[72,22],[50,36],[28,50],[72,50],[28,78],[72,78]],8:[[28,22],[72,22],[50,36],[28,50],[72,50],[50,64],[28,78],[72,78]],9:[[28,20],[72,20],[28,40],[72,40],[50,50],[28,60],[72,60],[28,80],[72,80]],10:[[28,18],[72,18],[50,29],[28,39],[72,39],[28,61],[72,61],[50,71],[28,82],[72,82]]};
function cardHTML(c){const color=red.has(c.s)?'red':'';let inner=`<div class="corner ${color}">${nameRank(c.r)}<span>${sy[c.s]}</span></div><div class="corner br ${color}">${nameRank(c.r)}<span>${sy[c.s]}</span></div>`;
 if(c.r===14) inner+=`<div class="aceMark ${color}">${sy[c.s]}</div>`;
 else if(c.r>=11) inner+=`<div class="court ${color}"><div class="frame"></div><div class="crown">${c.r===13?'♛':c.r===12?'♕':'♜'}</div><div class="head"></div><div class="body"></div><div class="sword"></div><div class="orn">${sy[c.s]}</div></div>`;
 else (pipPos[c.r]||[]).forEach(p=>inner+=`<span class="pip ${color}" style="left:${p[0]}%;top:${p[1]}%">${sy[c.s]}</span>`);
 return `<div class="card">${inner}</div>`}
function cardNode(c,cls=''){const d=document.createElement('div');d.className='playing '+cls;d.innerHTML=cardHTML(c);return d}
function renderHand(){const fan=document.getElementById('fan');fan.innerHTML='';const h=hands[me]||[];h.forEach((c,i)=>{const d=document.createElement('div');d.className='handCard';d.style.zIndex=i;const spread=Math.min(9,56/Math.max(1,h.length));const angle=(i-(h.length-1)/2)*spread;const x=(i-(h.length-1)/2)*Math.min(51,650/Math.max(1,h.length));d.style.transform=`translateX(calc(-50% + ${x}px)) rotate(${angle}deg)`;d.innerHTML=cardHTML(c);d.onclick=()=>selectCard(c,d);fan.appendChild(d)})}
function selectCard(c,node){if(turn!==me)return toast('نوبت شما نیست');selected=c;document.querySelectorAll('.handCard').forEach(x=>x.classList.remove('sel'));node.classList.add('sel');setTimeout(()=>play(c),100)}
function play(c){if(turn!==me||!selected)return;const idx=hands[me].findIndex(x=>x.id===c.id);if(idx<0)return;hands[me].splice(idx,1);addTrick(c,me);selected=null;turn=(turn+1)%players;renderAll();if(mode==='online')send({type:'play',card:c});else botLoop()}
function addTrick(c,p){trick.push({c,p});const area=document.getElementById('trick');const pos=['n','e','s','w'][p];const d=cardNode(c,'played '+pos);area.appendChild(d);setTimeout(()=>{if(trick.length===players){setTimeout(()=>{area.innerHTML='';trick=[];},800)}},50)}
function renderAll(){renderHand();document.getElementById('scoreText').textContent=`${scores[0]} - ${scores[1]}`}
function startLocal(n){mode='local';players=n;me=2;deck=makeDeck();hands=[[],[],[],[]];for(let i=0;i<deck.length;i++)hands[i%n].push(deck[i]);turn=2;trick=[];document.getElementById('trick').innerHTML='';for(let i=0;i<4;i++)document.getElementById('label'+i).textContent=n===2?(i===2?'شما':i===0?'ربات':''):i===2?'شما':'ربات '+(i+1);show('game');renderAll();toast('بازی شروع شد')}
function botLoop(){if(mode!=='local')return;if(turn===me)return;setTimeout(()=>{if(!hands[turn].length){newRound();return}const c=hands[turn][Math.floor(Math.random()*hands[turn].length)];hands[turn].splice(hands[turn].findIndex(x=>x.id===c.id),1);addTrick(c,turn);turn=(turn+1)%players;renderAll();if(turn!==me)botLoop();},550)}
function newRound(){deck=makeDeck();hands=[[],[],[],[]];for(let i=0;i<deck.length;i++)hands[i%players].push(deck[i]);turn=2;trick=[];document.getElementById('trick').innerHTML='';renderAll()}
function wsURL(){return (location.protocol==='https:'?'wss://':'ws://')+location.host}
function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}
function openLobby(){mode='online';show('lobby');document.getElementById('lobbyStart').style.display='block';document.getElementById('roomView').style.display='none'}
function connectWS(){if(ws&&ws.readyState<=1)return;ws=new WebSocket(wsURL());ws.onmessage=e=>handleServer(JSON.parse(e.data));ws.onclose=()=>toast('اتصال لابی قطع شد')}
function createRoom(){const name=document.getElementById('hostName').value.trim()||'محمد';const rn=document.getElementById('roomName').value.trim()||'اتاق '+name;connectWS();setTimeout(()=>send({type:'create',name,roomName:rn}),150)}
function joinRoom(){const name=document.getElementById('guestName').value.trim()||'بازیکن';const code=document.getElementById('roomCode').value.trim();if(!/^\d{6}$/.test(code))return toast('کد باید ۶ رقمی باشد');connectWS();setTimeout(()=>send({type:'join',name,code}),150)}
function handleServer(m){if(m.type==='created'||m.type==='joined'){roomCode=m.code;roomHost=m.host;document.getElementById('lobbyStart').style.display='none';document.getElementById('roomView').style.display='block';document.getElementById('roomCodeView').textContent=m.code;document.getElementById('roomTitle').textContent=m.roomName;renderSeats(m.players)}else if(m.type==='lobby'){renderSeats(m.players)}else if(m.type==='error'){toast(m.message)}else if(m.type==='start'){me=m.seat;players=4;hands=[[],[],[],[]];document.getElementById('trick').innerHTML='';show('game');applyPublic(m.state);hands[me]=m.hand;renderAll()}else if(m.type==='state'){applyPublic(m.state);if(m.hand)hands[me]=m.hand;renderAll()}}
function renderSeats(ps){roomPlayers=ps;const el=document.getElementById('seats');el.innerHTML=ps.map((p,i)=>`<div class="seat"><span class="dot ${p.online?'online':''}"></span> صندلی ${i+1}<strong>${p.name||'در انتظار...'}</strong><small>${p.host?'میزبان':''}</small></div>`).join('');for(let i=ps.length;i<4;i++)el.innerHTML+=`<div class="seat" style="opacity:.45">صندلی ${i+1}<strong>در انتظار...</strong></div>`;document.getElementById('startOnline').style.display=roomHost?'block':'none'}
function startOnlineGame(){send({type:'start'})}
function applyPublic(s){if(!s)return;turn=s.turn;scores=s.scores||[0,0];hokm=s.hokm||'s';(s.labels||[]).forEach((x,i)=>document.getElementById('label'+i).textContent=x)}
function copyRoomCode(){navigator.clipboard?.writeText(roomCode).then(()=>toast('کد اتاق کپی شد'))}
function shareRoom(){const t=`بیا سلطان حکم آنلاین بازی کنیم 🎴\nنام اتاق: ${document.getElementById('roomTitle').textContent}\nکد ورود: ${roomCode}`;if(navigator.share)navigator.share({title:'دعوت به سلطان حکم',text:t}).catch(()=>{});else navigator.clipboard?.writeText(t).then(()=>toast('دعوت کپی شد'))}
</script>
</body></html>
